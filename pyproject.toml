[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ml-training-demo-lab"
version = "0.1.0"
description = "Measured, local-first ML training demonstrations"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2,<3",
  "polars>=1,<2",
  "scikit-learn>=1.6,<2",
  "xgboost>=3,<4",
  "joblib>=1.4,<2",
  "onnxruntime>=1.20,<2",
  "skl2onnx>=1.18,<2",
  "shap>=0.48,<1",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.6,<1",
]

[project.scripts]
ml-demo = "ml_training.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ml_training"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
# Notebooks have their own snapshot checks; model environments are installed copies.
extend-exclude = ["notebooks", "environments"]

[tool.ruff.lint]
# Errors only (pyflakes and syntax-level pycodestyle); style is left to `ruff format`.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# These imports deliberately follow timing start / proof that networking is denied.
"scripts/cold_slm.py" = ["E402"]
"scripts/validate_edge_offline.py" = ["E402"]
